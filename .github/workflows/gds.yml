name: Tiny Tapeout GDSII (Manual)

on:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Tiny Tapeout metadata & RTL
        run: |
          test -f info.yaml
          test -f docs/info.md
          test -f rtl/config.json
          mkdir -p build/gds
          echo "Arquivos de configuração Tiny Tapeout/OpenLane verificados."

      - name: Run OpenLane via Docker (Sky130)
        run: |
          docker run --rm \
            -v "$PWD/rtl:/work/rtl" \
            -v "$PWD/build:/work/build" \
            efabless/openlane:latest \
            bash -lc '
              set -e
              volare enable --pdk sky130 bdc9412b3e468c102d01b7cf6337be06ec6e9c9a
              flow.tcl -design /work/rtl -tag tt_run -overwrite
              mkdir -p /work/build/gds
              cp -r /work/rtl/runs/tt_run/results/final/gds/* /work/build/gds/
              cp /work/rtl/runs/tt_run/reports/metrics.csv /work/build/gds/ 2>/dev/null || true
            '

      - name: Upload GDSII artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurochip-snn-gdsii
          path: build/gds/*
          if-no-files-found: warn
