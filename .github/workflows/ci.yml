name: NeuroChip SNN CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-synth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install EDA tools (Icarus Verilog & Yosys)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full simulation & verification suite
        run: |
          chmod +x neurochip_snn.sh
          ./neurochip_snn.sh sim-all

      - name: Run ASIC synthesis (Yosys)
        run: |
          ./neurochip_snn.sh synth-all

      - name: Upload synthesis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yosys-synthesis-reports
          path: build/*.rpt
          if-no-files-found: warn
